[package]
name = "midijitter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
alsa = "0.12.1"
clap = { version = "4.5", features = ["derive"] }
csv = "1"
libc = "0.2.189"
pipewire = { version = "0.10.1", features = ["v0_3_41"] }
plotters = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"
